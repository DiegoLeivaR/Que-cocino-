<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué Cocino Hoy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#f7f2e9; --crema:#fffdf8; --tinta:#2f2a24; --suave:#8c8177;
    --linea:#ded3c4; --terra:#c9502a; --palta:#5f8a55;
    --mostaza:#dda32c; --aji:#c8880f;
    --sombra:rgba(47,42,36,.16);
    --display:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    --texto:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--papel);color:var(--tinta);
       font-family:var(--texto);line-height:1.55;letter-spacing:-.01em}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(circle at 1px 1px,rgba(47,42,36,.05) 1px,transparent 0);
    background-size:20px 20px}
  .wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 15px 70px}
  svg{display:block}
  .ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;
       stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico.sm{width:16px;height:16px;stroke-width:1.9}

  /* ---------- cabecera: display rotundo contra versalitas diminutas ---------- */
  header{text-align:center;padding:30px 0 16px}
  h1{margin:0;font-family:var(--display);font-weight:600;
     font-size:clamp(2.1rem,9vw,2.9rem);letter-spacing:-.035em;line-height:1}
  /* los signos de interrogacion invertidos son puro español: los usamos de adorno */
  h1 .sig{font-family:var(--display);color:var(--aji);font-weight:500;
          font-size:1.12em;display:inline-block;vertical-align:-.06em}
  h1 .sig.izq{transform:rotate(-7deg)}
  h1 .sig.der{transform:rotate(7deg)}
  .subrayado{margin:6px auto 0;width:172px;height:10px;color:var(--mostaza)}
  .sub{margin-top:13px;font-size:.68rem;font-weight:700;text-transform:uppercase;
       letter-spacing:.19em;color:var(--suave)}
  .sello{display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    background:var(--crema);border:2px solid var(--tinta);padding:5px 13px;
    border-radius:16px 14px 17px 13px;font-size:.74rem;font-weight:700;
    box-shadow:2px 2px 0 var(--tinta);transform:rotate(-1.2deg)}

  .card{background:var(--crema);border:2px solid var(--tinta);
    border-radius:26px 22px 27px 21px;padding:18px 17px;margin-bottom:16px;
    box-shadow:4px 5px 0 var(--sombra)}
  .card:nth-of-type(even){border-radius:22px 27px 21px 26px}
  .titulo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .num{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;
    background:var(--terra);color:#fff;font-family:var(--display);
    font-size:.85rem;font-weight:600;border:2px solid var(--tinta);
    border-radius:50% 46% 52% 48%;box-shadow:1.5px 2px 0 var(--tinta)}
  .titulo h2{margin:0;font-family:var(--display);font-size:1rem;font-weight:600;
             letter-spacing:-.02em;flex:1}
  .titulo .ico{color:var(--suave)}

  .nota{display:flex;gap:11px;background:#fdf6e3;border:2px dashed var(--mostaza);
    border-radius:20px 17px 21px 16px;padding:13px 14px;margin-bottom:16px;
    font-size:.79rem;color:#6d5722;line-height:1.5}
  .nota .ico{color:var(--mostaza);margin-top:1px}
  .nota b{color:#4a3a12}

  /* ---------- zona de foto ---------- */
  .soltar{display:flex;flex-direction:column;align-items:center;gap:8px;
    border:2.5px dashed var(--linea);border-radius:22px 19px 23px 18px;
    padding:24px 16px;text-align:center;color:var(--suave);font-size:.87rem;
    transition:.15s;cursor:pointer}
  .soltar:hover{border-color:var(--terra);color:var(--terra);background:#fff8f4}
  .soltar.encima{border-color:var(--terra);background:#ffeee4;color:var(--terra);
                 transform:scale(1.015)}
  .soltar .ico{width:32px;height:32px;stroke-width:1.5}
  .soltar b{font-family:var(--display);font-weight:500;font-size:1rem;color:inherit}
  .soltar small{font-size:.75rem;opacity:.8}
  .vias{display:grid;gap:8px;margin-top:12px}
  .via{display:flex;align-items:center;gap:9px;width:100%;
    background:var(--crema);color:var(--tinta);border:2px solid var(--tinta);
    border-radius:16px 13px 17px 12px;padding:10px 13px;font-family:var(--texto);
    font-size:.85rem;font-weight:700;cursor:pointer;text-align:left;
    box-shadow:2.5px 3px 0 var(--sombra);transition:transform .1s,box-shadow .1s}
  .via:hover{background:#fff3ea}
  .via:active{transform:translate(2.5px,3px);box-shadow:0 0 0}
  .via span{flex:1}
  .via .ico{color:var(--terra)}
  .via small{font-weight:500;color:var(--suave);font-size:.72rem}
  #vista{max-width:100%;border-radius:18px;margin-top:13px;border:2px solid var(--tinta);
         box-shadow:3px 3px 0 var(--sombra);display:none}
  .panel{display:none;margin-top:12px;padding:14px;background:var(--papel);
    border:2px solid var(--tinta);border-radius:18px 15px 19px 14px;text-align:center}
  .panel.abierto{display:block}
  .panel video{width:100%;max-width:340px;border-radius:14px;border:2px solid var(--tinta);
               background:#000;display:block;margin:0 auto}

  .estado{display:none;margin-top:12px;font-size:.83rem;padding:11px 13px;
    border-radius:16px 14px 17px 13px;border:2px solid currentColor}
  .estado > div{color:var(--tinta)}
  .estado.trabajando{display:flex;gap:9px;align-items:center;color:var(--terra);background:#fff5f0}
  .estado.bien{display:flex;gap:9px;align-items:flex-start;color:var(--palta);background:#f2f7ef}
  .estado.mal{display:flex;gap:9px;align-items:flex-start;color:#b03a22;background:#fdf0ec}
  .puntos::after{content:"";animation:pts 1.2s infinite steps(4)}
  @keyframes pts{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .girando{animation:gira 1.1s linear infinite;transform-origin:center}
  @keyframes gira{to{transform:rotate(360deg)}}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--tinta);
    background:var(--crema);border-radius:15px 13px 16px 12px;padding:6px 12px;
    font-size:.84rem;font-weight:600;cursor:pointer;user-select:none;
    box-shadow:2px 2.5px 0 var(--sombra);transition:transform .1s,box-shadow .1s}
  .chip:nth-child(3n){border-radius:13px 16px 12px 15px}
  .chip:active{transform:translate(2px,2.5px);box-shadow:0 0 0 var(--sombra)}
  .chip.on{background:var(--terra);color:#fff;box-shadow:2px 2.5px 0 var(--tinta)}
  .chip .ico{display:none}
  .chip.on .ico{display:block}
  .chip small{opacity:.7;font-size:.75em;font-weight:500}
  .chip.ia{animation:brinca .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes brinca{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.16) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
  .rotulo{display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.13em;color:var(--suave);margin:16px 0 9px}
  .rotulo .ico{color:var(--mostaza)}

  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:5px;
    border:2px solid var(--tinta);background:var(--crema);
    border-radius:18px 15px 19px 14px;padding:12px 5px;font-size:.8rem;font-weight:700;
    cursor:pointer;box-shadow:2.5px 3px 0 var(--sombra);transition:transform .1s,box-shadow .1s}
  .opt:active{transform:translate(2px,3px);box-shadow:0 0 0}
  .opt.on{background:var(--terra);color:#fff;box-shadow:2.5px 3px 0 var(--tinta)}
  .llamas{display:flex;gap:1px}
  .llamas .ico{width:17px;height:17px}
  .llamas .apagada{opacity:.22}

  .marcas{display:flex;gap:5px;margin-bottom:12px}
  .marca{flex:1;text-align:center;font-size:.72rem;color:var(--suave);cursor:pointer;
    padding:9px 2px;border-radius:15px 12px 16px 11px;border:2px solid transparent;
    transition:.14s;line-height:1.25}
  .marca b{display:block;font-family:var(--display);font-size:1rem;color:var(--tinta);font-weight:600}
  .marca.on{border-color:var(--tinta);background:#fff6ea;box-shadow:2px 2.5px 0 var(--sombra)}
  .marca.on b{color:var(--terra)}
  .riel{position:relative;padding:0 3px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:11px;margin:0;
    background:var(--papel);border:2px solid var(--tinta);border-radius:8px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:25px;height:25px;
    border-radius:50% 45% 52% 48%;background:var(--mostaza);border:2px solid var(--tinta);
    cursor:grab;box-shadow:1.5px 2px 0 var(--tinta);margin-top:-9px}
  input[type=range]::-moz-range-thumb{width:23px;height:23px;border-radius:50%;
    background:var(--mostaza);border:2px solid var(--tinta);cursor:grab}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--terra);color:#fff;border:2px solid var(--tinta);
    border-radius:19px 16px 20px 15px;padding:12px;font-family:var(--display);
    font-size:.95rem;font-weight:600;cursor:pointer;
    box-shadow:3px 4px 0 var(--tinta);transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){background:#b3421f}
  .btn:active:not(:disabled){transform:translate(3px,4px);box-shadow:0 0 0}
  .btn:disabled{background:#cfc5b8;cursor:default;box-shadow:3px 4px 0 var(--sombra)}
  .btn.grande{padding:15px;font-size:1.08rem;border-radius:22px 18px 23px 17px}
  .btn.suave{background:var(--crema);color:var(--tinta);margin-top:13px;
             box-shadow:2.5px 3px 0 var(--sombra)}
  .btn.suave:hover:not(:disabled){background:#fff3ea}
  button.limpiar{background:none;border:none;color:var(--terra);font-family:inherit;
    font-size:.78rem;font-weight:700;cursor:pointer;padding:0;
    display:inline-flex;align-items:center;gap:4px}
  button.limpiar:hover{text-decoration:underline}

  .receta{border:2px solid var(--tinta);border-radius:22px 19px 23px 18px;
    padding:15px 14px;margin-bottom:13px;background:var(--crema);
    box-shadow:3px 4px 0 var(--sombra)}
  .receta:nth-child(even){border-radius:19px 23px 18px 22px}
  .rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .rnom{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;
        letter-spacing:-.025em;line-height:1.2}
  .rmeta{display:flex;align-items:center;gap:5px;color:var(--suave);font-size:.77rem;margin-top:5px}
  .rextra{color:var(--suave);font-size:.75rem;margin-top:3px;font-style:italic}
  .precio{text-align:right;white-space:nowrap;flex:0 0 auto}
  .pfalta{font-family:var(--display);font-size:1.4rem;font-weight:600;
          color:var(--terra);letter-spacing:-.03em}
  .ptot{font-size:.7rem;color:var(--suave);line-height:1.35}
  .sobre{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;color:#b03a22;
         font-weight:800;margin-top:3px}
  .onda{width:100%;height:8px;color:var(--linea);margin:12px 0 9px}
  .li{display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:3px 0;font-size:.82rem}
  .li span:first-child{display:flex;align-items:center;gap:6px}
  .li .ico{color:var(--linea)}
  .li.tengo{color:var(--palta)}
  .li.tengo .ico{color:var(--palta)}
  .li b{font-weight:700}

  .expl{display:none;margin-top:14px;padding-top:14px;
        border-top:2px dashed var(--linea);font-size:.88rem}
  .expl h2{display:flex;align-items:center;gap:7px;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.13em;color:var(--terra);margin:16px 0 7px;font-weight:800}
  .expl h2:first-child{margin-top:0}
  .expl h2::before{content:"";width:9px;height:9px;background:var(--mostaza);
    border:2px solid var(--tinta);border-radius:50% 45% 52% 48%}
  .expl ol,.expl ul{padding-left:21px;margin:7px 0}
  .expl li{margin:5px 0}
  .expl p{margin:7px 0}

  .nada{text-align:center;color:var(--suave);padding:22px 12px;font-size:.87rem}
  .nada .olla{width:74px;height:74px;margin:0 auto 12px;color:var(--linea);
    stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
  .vapor{animation:vapor 2.6s ease-in-out infinite}
  .vapor2{animation:vapor 2.6s ease-in-out infinite .5s}
  @keyframes vapor{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}

  :focus-visible{outline:3px solid var(--aji);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><span class="sig izq">¿</span>Qué cocino hoy<span class="sig der">?</span></h1>
  <svg class="subrayado" viewBox="0 0 172 10" fill="none" stroke="currentColor"
       stroke-width="3.2" stroke-linecap="round">
    <path d="M4 6.6c24-4 47 2.4 71-.6 24-3 47 2.8 93 1.3"/>
  </svg>
  <div class="sub">Recetas peruanas · precios de verdad</div>
  <div class="sello">
    <svg class="ico sm" viewBox="0 0 24 24"><path d="M12 3.5 13.4 8 18 9.4 13.4 10.8 12 15.3 10.6 10.8 6 9.4 10.6 8z"/><path d="M18.4 15.6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
    <span id="fuente">cargando…</span>
  </div>
</header>

<div class="nota">
  <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5M12 7.9v.1"/></svg>
  <div id="notaPrecios"></div>
</div>

<div class="card">
  <div class="titulo">
    <div class="num">1</div><h2>Tu foto</h2>
    <svg class="ico" viewBox="0 0 24 24"><path d="M3.2 8.6A2.5 2.5 0 0 1 5.7 6.1h1.6l1-1.8a1 1 0 0 1 .9-.5h5.6a1 1 0 0 1 .9.5l1 1.8h1.6a2.5 2.5 0 0 1 2.5 2.5v8.8a2.5 2.5 0 0 1-2.5 2.5H5.7a2.5 2.5 0 0 1-2.5-2.5z"/><circle cx="12" cy="12.9" r="3.5"/></svg>
  </div>

  <div class="soltar" id="zona">
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 15.6V4.2M8.2 7.9 12 4.1l3.8 3.8"/><path d="M4.2 14.4v3.4a2 2 0 0 0 2 2h11.6a2 2 0 0 0 2-2v-3.4"/></svg>
    <b>Arrastra una foto aquí</b>
    <small>o pégala con Ctrl+V</small>
  </div>

  <div class="vias">
    <button class="via" id="viaArchivo">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5.4 20.4h13.2a1.8 1.8 0 0 0 1.8-1.8V9.2L14.6 3.6H5.4a1.8 1.8 0 0 0-1.8 1.8v13.2a1.8 1.8 0 0 0 1.8 1.8z"/><path d="M14.2 3.7v5.4h5.9"/></svg>
      <span>Subir un archivo<br><small>elige una imagen de tu computadora</small></span>
    </button>
    <button class="via" id="viaCamara">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3.2 8.6A2.5 2.5 0 0 1 5.7 6.1h1.6l1-1.8a1 1 0 0 1 .9-.5h5.6a1 1 0 0 1 .9.5l1 1.8h1.6a2.5 2.5 0 0 1 2.5 2.5v8.8a2.5 2.5 0 0 1-2.5 2.5H5.7a2.5 2.5 0 0 1-2.5-2.5z"/><circle cx="12" cy="12.9" r="3.5"/></svg>
      <span id="txtCamara">Tomar foto ahora<br><small>usa la cámara de esta computadora</small></span>
    </button>
  </div>

  <input type="file" id="f" accept="image/*" hidden>
  <input type="file" id="fcam" accept="image/*" capture="environment" hidden>

  <div class="panel" id="panelCam">
    <video id="video" playsinline muted></video>
    <button class="btn" id="disparar" style="margin-top:12px">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.4"/></svg>
      <span>Capturar</span>
    </button>
  </div>
  <img id="vista" alt="tu foto">
  <div class="estado" id="est"></div>
</div>

<div class="card">
  <div class="titulo">
    <div class="num">2</div><h2>Qué tienes en casa</h2>
    <button class="limpiar" id="clr">
      <svg class="ico sm" viewBox="0 0 24 24"><path d="M5.5 7h13M9.5 7V5.4a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7M7.4 7l.8 11a1.6 1.6 0 0 0 1.6 1.5h4.4a1.6 1.6 0 0 0 1.6-1.5l.8-11"/></svg>
      limpiar
    </button>
  </div>
  <div id="zonaExtra"></div>
  <div class="chips" id="ings"></div>
</div>

<div class="card">
  <div class="titulo">
    <div class="num">3</div><h2>Qué tan elaborado</h2>
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.2s4.6 4 4.6 8.1a4.6 4.6 0 0 1-9.2 0c0-1.5.7-2.9 1.4-3.8.2 1.1.8 2 1.6 2.3-.3-2.1 1.6-4.3 1.6-6.6z"/></svg>
  </div>
  <div class="opts" id="dif"></div>
</div>

<div class="card">
  <div class="titulo">
    <div class="num">4</div><h2>Cuánto puedes gastar</h2>
    <svg class="ico" viewBox="0 0 24 24"><path d="M3.6 8.2a2 2 0 0 1 2-2h11.2a2 2 0 0 1 2 2"/><rect x="3.6" y="8.2" width="16.8" height="11" rx="2.6"/><circle cx="16.3" cy="13.7" r="1.25"/></svg>
  </div>
  <div class="marcas" id="marcas"></div>
  <div class="riel"><input type="range" id="reg" min="0" max="3" step="1" value="1"></div>
</div>

<div class="card">
  <button class="btn grande" id="buscar">
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5 13.4 8 18 9.4 13.4 10.8 12 15.3 10.6 10.8 6 9.4 10.6 8z"/><path d="M18.4 15.6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>
    <span>Buscar recetas</span>
  </button>
  <div class="estado" id="estR"></div>
</div>

<div class="card">
  <div class="titulo">
    <div class="num">5</div><h2>Para 4 porciones</h2>
    <svg class="ico" viewBox="0 0 24 24"><path d="M4.2 10.5h15.6M5.6 10.5l1 7.4a2 2 0 0 0 2 1.7h6.8a2 2 0 0 0 2-1.7l1-7.4"/><path d="M9 7.4c0-1.2 1.3-1.5 1.3-2.6M12.4 7.4c0-1.4 1.5-1.7 1.5-3"/></svg>
  </div>
  <div id="out"></div>
</div>

</div>

<script src="precios.js"></script>
<script src="recetas.js"></script>
<script>
const $ = s => document.querySelector(s);

const ICO = {
  reloj:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3 1.8"/>',
  check:'<circle cx="12" cy="12" r="8.4"/><path d="m8.4 12.2 2.4 2.4 4.7-5"/>',
  punto:'<circle cx="12" cy="12" r="2.6"/>',
  chispa:'<path d="M12 3.5 13.4 8 18 9.4 13.4 10.8 12 15.3 10.6 10.8 6 9.4 10.6 8z"/><path d="M18.4 15.6l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  llama:'<path d="M12 3.2s4.6 4 4.6 8.1a4.6 4.6 0 0 1-9.2 0c0-1.5.7-2.9 1.4-3.8.2 1.1.8 2 1.6 2.3-.3-2.1 1.6-4.3 1.6-6.6z"/>',
  libro:'<path d="M4.2 5.9a1.6 1.6 0 0 1 1.6-1.6h4.3A2 2 0 0 1 12 5.6a2 2 0 0 1 1.9-1.3h4.3a1.6 1.6 0 0 1 1.6 1.6v11.6a1.6 1.6 0 0 1-1.6 1.6h-4.3A2 2 0 0 0 12 20.4a2 2 0 0 0-1.9-1.3H5.8a1.6 1.6 0 0 1-1.6-1.6z"/><path d="M12 5.6v14.8"/>',
  alerta:'<path d="M12 4.4 21 19.4H3z"/><path d="M12 10v3.6M12 16.6v.1"/>',
  ojo:'<path d="M2.6 12S6.4 5.9 12 5.9 21.4 12 21.4 12 17.6 18.1 12 18.1 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.9"/>',
  cargando:'<path d="M12 3.6v3.2M12 17.2v3.2M20.4 12h-3.2M6.8 12H3.6M18.4 5.6l-2.3 2.3M7.9 16.1l-2.3 2.3M18.4 18.4l-2.3-2.3M7.9 7.9 5.6 5.6"/>',
  etiqueta:'<path d="M11.3 3.6H5.4a1.8 1.8 0 0 0-1.8 1.8v5.9a1.8 1.8 0 0 0 .53 1.27l7.1 7.1a1.8 1.8 0 0 0 2.54 0l5.9-5.9a1.8 1.8 0 0 0 0-2.54l-7.1-7.1a1.8 1.8 0 0 0-1.27-.53z"/><path d="M7.9 7.9v.1"/>',
};
const ico = (n, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24">${ICO[n]}</svg>`;

const NIVELES = [
  {t:"S/ 0",  d:"lo que tengo", max:0},
  {t:"S/ 10", d:"lo justo",     max:10},
  {t:"S/ 30", d:"normal",       max:30},
  {t:"S/ 50+",d:"sin apuro",    max:9999},
];
const DIFS = [
  {v:"facil",      t:"Fácil",     llamas:1},
  {v:"media",      t:"Media",     llamas:2},
  {v:"complicado", t:"Elaborado", llamas:3},
];

let tengo = new Set(), dif = "media", nivel = 1;
let recetas = [], ultimas = [];
let extras = {};   // lo que salio de la foto y no esta en el SISAP

const precioKg = ing =>
  extras[ing] ?? (PRECIOS.productos[ing] || {}).mercado ?? null;

$("#fuente").textContent = "Precios reales · " + PRECIOS.fecha;

const conSuper = Object.values(PRECIOS.productos).filter(p => p.fuente === "super").length;
const total = Object.keys(PRECIOS.productos).length;
$("#notaPrecios").innerHTML =
  `<b>De dónde salen los precios.</b> Mayorista real del SISAP (MIDAGRI) del ${PRECIOS.fecha},
   cruzado con el precio de lista de Plaza Vea sin ofertas. Lo que ves es el estimado de
   <b>mercado de barrio</b> = súper ÷ ${PRECIOS.factor_super}.
   ${conSuper} de ${total} productos tienen precio de súper;
   el resto usa el margen mediano observado (×${PRECIOS.margen_tipico}).`;

/* ---------- chips ---------- */
function pintaChips() {
  $("#ings").innerHTML = Object.keys(PRECIOS.productos).sort().map(i =>
    `<div class="chip ${tengo.has(i) ? "on" : ""}" data-i="${i}">${ico("check","ico sm")}
     <span>${i}</span><small>S/${precioKg(i).toFixed(2)}</small></div>`).join("");
}
pintaChips();

function pintaExtras() {
  const claves = Object.keys(extras);
  $("#zonaExtra").innerHTML = !claves.length ? "" :
    `<div class="rotulo">${ico("etiqueta","ico sm")} de tu foto · precio del súper</div>
     <div class="chips">` + claves.map(i =>
      `<div class="chip ${tengo.has(i) ? "on" : ""}" data-i="${i}">${ico("check","ico sm")}
       <span>${i}</span><small>S/${extras[i].toFixed(2)}</small></div>`).join("") +
    `</div><div class="rotulo">${ico("etiqueta","ico sm")} del mercado mayorista</div>`;
}

document.addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const i = c.dataset.i;
  tengo.has(i) ? tengo.delete(i) : tengo.add(i);
  c.classList.toggle("on");
  marcarViejo();
});
$("#clr").onclick = () => {
  tengo.clear();
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  marcarViejo();
};

/* ---------- dificultad ---------- */
$("#dif").innerHTML = DIFS.map(d => `
  <div class="opt ${d.v === dif ? "on" : ""}" data-v="${d.v}">
    <div class="llamas">${[1,2,3].map(n =>
      `<svg class="ico ${n > d.llamas ? "apagada" : ""}" viewBox="0 0 24 24">${ICO.llama}</svg>`
    ).join("")}</div><span>${d.t}</span></div>`).join("");
$("#dif").onclick = e => {
  const o = e.target.closest(".opt"); if (!o) return;
  $("#dif").querySelectorAll(".opt").forEach(x => x.classList.remove("on"));
  o.classList.add("on"); dif = o.dataset.v; marcarViejo();
};

/* ---------- regleta ---------- */
$("#marcas").innerHTML = NIVELES.map((n,i) =>
  `<div class="marca" data-n="${i}"><b>${n.t}</b>${n.d}</div>`).join("");
function pintaRegleta() {
  document.querySelectorAll(".marca").forEach((m,i) => m.classList.toggle("on", i === nivel));
  $("#reg").value = nivel;
}
$("#reg").oninput = e => { nivel = +e.target.value; pintaRegleta(); marcarViejo(); };
$("#marcas").onclick = e => {
  const m = e.target.closest(".marca"); if (!m) return;
  nivel = +m.dataset.n; pintaRegleta(); marcarViejo();
};
function marcarViejo() {
  if (!recetas.length) return;
  $("#buscar").querySelector("span").textContent = "Buscar otras recetas";
  render(true);
}

/* ---------- recetas ---------- */
async function pedirRecetas() {
  const b = $("#buscar"), est = $("#estR");
  b.disabled = true; b.querySelector("span").textContent = "Pensando…";
  est.className = "estado trabajando";
  est.innerHTML = ico("cargando","ico girando") +
    '<div><span class="puntos">Buscando platos para lo que tienes</span></div>';
  try {
    const res = await fetch("/api/recetas", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ tengo:[...tengo], dificultad:dif,
                             presupuesto:NIVELES[nivel].max, extras })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (!d.recetas || !d.recetas.length) throw new Error("No devolvió recetas. Prueba otra vez.");
    recetas = d.recetas;
    est.style.display = "none";
    render();
  } catch (err) {
    recetas = (typeof RECETAS !== "undefined" ? RECETAS.filter(r => r.dif === dif) : []);
    est.className = "estado mal";
    est.innerHTML = ico("alerta") + `<div><b>La IA no respondió.</b> ${err.message}` +
      (recetas.length ? "<br><small>Te muestro el recetario de respaldo.</small>" : "") + "</div>";
    render();
  } finally {
    b.disabled = false; b.querySelector("span").textContent = "Buscar otras recetas";
  }
}
$("#buscar").onclick = pedirRecetas;

const ONDA = `<svg class="onda" viewBox="0 0 300 8" preserveAspectRatio="none" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <path d="M2 5c18-4 36 4 54 0s36-4 54 0 36 4 54 0 36-4 54 0 36 4 80 0"/></svg>`;

function render(viejo) {
  ultimas = recetas.map(r => {
    let falta = 0, total = 0, det = [];
    for (const [ing, kg] of Object.entries(r.ing)) {
      const pk = precioKg(ing);
      if (pk === null) continue;
      const costo = pk * kg;
      total += costo;
      const lo_tengo = tengo.has(ing);
      if (!lo_tengo) falta += costo;
      det.push({ ing, kg, costo, lo_tengo });
    }
    det.sort((a,b) => b.costo - a.costo);
    return { ...r, falta, total, det };
  }).sort((a,b) => a.falta - b.falta);

  if (!ultimas.length) {
    $("#out").innerHTML = `<div class="nada">
      <svg class="olla" viewBox="0 0 64 64">
        <path class="vapor" d="M24 17c0-4 4-4.5 4-8"/>
        <path class="vapor2" d="M33 15c0-4.5 4.5-5 4.5-9"/>
        <path class="vapor" d="M42 17c0-4 4-4.5 4-8"/>
        <path d="M9 30h46M14 30l2.6 20a5 5 0 0 0 5 4.3h20.8a5 5 0 0 0 5-4.3L50 30"/>
        <path d="M55 33h4a3 3 0 0 1 0 6h-4M9 33H5a3 3 0 0 0 0 6h4"/>
      </svg>
      Marca lo que tienes y dale a <b>Buscar recetas</b>.</div>`;
    return;
  }

  const tope = NIVELES[nivel].max;
  $("#out").innerHTML =
    (viejo ? `<div class="nada" style="padding:4px 0 14px">Cambiaste algo · dale a
              <b>Buscar otras recetas</b></div>` : "") +
    ultimas.map((r,k) => `
    <div class="receta">
      <div class="rtop">
        <div>
          <p class="rnom">${r.nombre}</p>
          <div class="rmeta">${ico("reloj","ico sm")} ${r.min} min</div>
          ${r.extra && r.extra.length ? `<div class="rextra">+ ${r.extra.join(", ")}</div>` : ""}
        </div>
        <div class="precio">
          <div class="pfalta">S/ ${r.falta.toFixed(2)}</div>
          <div class="ptot">te falta comprar<br>plato entero S/ ${r.total.toFixed(2)}</div>
          ${r.falta > tope ? `<div class="sobre">${ico("alerta","ico sm")} pasa de S/ ${tope}</div>` : ""}
        </div>
      </div>
      ${ONDA}
      ${r.det.map(d => `<div class="li ${d.lo_tengo ? "tengo" : ""}">
          <span>${ico(d.lo_tengo ? "check" : "punto","ico sm")}
                ${d.ing} · ${(d.kg*1000).toFixed(0)}g</span>
          <span>${d.lo_tengo ? "ya lo tienes" : "<b>S/ " + d.costo.toFixed(2) + "</b>"}</span>
        </div>`).join("")}
      <button class="btn suave" data-k="${k}">
        ${ico("libro")}<span>Explícame cómo hacerlo</span>
      </button>
      <div class="expl" id="ex${k}"></div>
    </div>`).join("");
}

/* ---------- explicacion ---------- */
$("#out").onclick = async e => {
  const b = e.target.closest(".btn"); if (!b) return;
  const r = ultimas[+b.dataset.k], caja = $("#ex" + b.dataset.k);
  b.disabled = true; b.querySelector("span").textContent = "Pensando…";
  b.querySelector(".ico").outerHTML = ico("cargando","ico girando");
  try {
    const res = await fetch("/api/explicar", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        receta:r.nombre, dificultad:dif, presupuesto:NIVELES[nivel].t,
        tengo:r.det.filter(d => d.lo_tengo).map(d => d.ing),
        falta:r.det.filter(d => !d.lo_tengo),
      })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    caja.innerHTML = md(d.texto);
    caja.style.display = "block";
    b.style.display = "none";
  } catch (err) {
    b.disabled = false;
    b.innerHTML = ico("libro") + "<span>Explícame cómo hacerlo</span>";
    caja.innerHTML = `<div class="estado mal" style="display:flex">${ico("alerta")}<div>${err.message}</div></div>`;
    caja.style.display = "block";
  }
};

function md(t) {
  const esc = s => s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  const out = []; let lista = null;
  for (const linea of esc(t).split("\n")) {
    const l = linea.trim();
    const enc = l.match(/^#{1,3}\s+(.*)/), num = l.match(/^\d+[.)]\s+(.*)/), vin = l.match(/^[-*]\s+(.*)/);
    const cerrar = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };
    if (enc)      { cerrar(); out.push(`<h2>${enc[1]}</h2>`); }
    else if (num) { if (lista !== "ol") { cerrar(); out.push("<ol>"); lista = "ol"; } out.push(`<li>${num[1]}</li>`); }
    else if (vin) { if (lista !== "ul") { cerrar(); out.push("<ul>"); lista = "ul"; } out.push(`<li>${vin[1]}</li>`); }
    else if (!l)  { cerrar(); }
    else          { cerrar(); out.push(`<p>${l}</p>`); }
  }
  if (lista) out.push(`</${lista}>`);
  return out.join("").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

/* ================= FOTO: archivo, arrastrar, pegar, camara, celular ========= */
const esMovil = matchMedia("(pointer: coarse)").matches;
if (esMovil) {
  $("#txtCamara").innerHTML = "Tomar foto ahora<br><small>abre la cámara de tu celular</small>";
}

function achicar(file, max = 1568) {   // mas resolucion = reconoce mas cosas
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const e = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*e); c.height = Math.round(img.height*e);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", .88).split(",")[1]);
    };
    img.onerror = mal; img.src = URL.createObjectURL(file);
  });
}

async function analizar(b64, urlVista) {
  const img = $("#vista"), est = $("#est");
  img.src = urlVista; img.style.display = "block";
  est.className = "estado trabajando";
  est.innerHTML = ico("ojo") + '<div><span class="puntos">Mirando tu foto</span></div>';
  try {
    const res = await fetch("/api/ver", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ imagen:b64, mime:"image/jpeg" })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);

    for (const e of (d.extras || [])) { extras[e.nombre] = e.mercado; tengo.add(e.nombre); }
    pintaExtras();

    let nuevos = 0;
    for (const ing of d.reconocidos) {
      if (!tengo.has(ing)) { tengo.add(ing); nuevos++; }
    }
    pintaChips();
    for (const ing of d.reconocidos) {
      const c = document.querySelector(`.chip[data-i="${ing}"]`);
      if (c) { c.classList.add("ia"); setTimeout(() => c.classList.remove("ia"), 650); }
    }

    const sinPrecio = (d.otros || []).filter(o => !(o in extras));
    est.className = "estado bien";
    est.innerHTML = ico("check") +
      `<div><b>Encontré ${d.reconocidos.length + Object.keys(d.extras||{}).length} cosa(s)</b>` +
      (nuevos ? ` · marqué ${nuevos} nueva(s)` : "") +
      (d.comentario ? `<br><em>${d.comentario}</em>` : "") +
      ((d.extras||[]).length ? `<br><small>Con precio del súper: ${
        d.extras.map(e => `${e.nombre} S/${e.mercado}`).join(", ")}</small>` : "") +
      (sinPrecio.length ? `<br><small>Vi pero no encontré precio: ${sinPrecio.join(", ")}</small>` : "") +
      "</div>";
    pedirRecetas();
  } catch (err) {
    est.className = "estado mal";
    est.innerHTML = ico("alerta") +
      `<div><b>No pude analizar la foto.</b><br>${err.message}
       <br><small>Marca los ingredientes a mano abajo.</small></div>`;
  }
}

async function procesar(file) {
  if (!file || !file.type.startsWith("image/")) return;
  cerrarPaneles();
  analizar(await achicar(file), URL.createObjectURL(file));
}

$("#f").onchange   = e => procesar(e.target.files[0]);
$("#fcam").onchange = e => procesar(e.target.files[0]);
$("#viaArchivo").onclick = () => { cerrarPaneles(); $("#f").click(); };
$("#zona").onclick       = () => { cerrarPaneles(); $("#f").click(); };

/* arrastrar y soltar */
const zona = $("#zona");
["dragenter","dragover"].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.add("encima");
}));
["dragleave","drop"].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.remove("encima");
}));
zona.addEventListener("drop", e => procesar(e.dataTransfer.files[0]));
// que soltar fuera de la zona no navegue a la imagen
["dragover","drop"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));

/* pegar con Ctrl+V */
document.addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith("image/"));
  if (it) procesar(it.getAsFile());
});

/* camara */
let flujo = null;
function cerrarPaneles() {
  $("#panelCam").classList.remove("abierto");
  if (flujo) { flujo.getTracks().forEach(t => t.stop()); flujo = null; }
}

$("#viaCamara").onclick = async () => {
  if (esMovil) { cerrarPaneles(); return $("#fcam").click(); }
  const panel = $("#panelCam");
  if (panel.classList.contains("abierto")) return cerrarPaneles();
  cerrarPaneles();
  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false });
    $("#video").srcObject = flujo;
    await $("#video").play();
    panel.classList.add("abierto");
  } catch (err) {
    const est = $("#est");
    est.className = "estado mal";
    est.innerHTML = ico("alerta") +
      `<div><b>No pude abrir la cámara.</b> ${err.message}
       <br><small>Sube un archivo o usa tu celular.</small></div>`;
  }
};

$("#disparar").onclick = () => {
  const v = $("#video");
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const b64 = c.toDataURL("image/jpeg", .88).split(",")[1];
  const url = c.toDataURL("image/jpeg", .7);
  cerrarPaneles();
  analizar(b64, url);
};


pintaRegleta();
render();
</script>
</body>
</html>
